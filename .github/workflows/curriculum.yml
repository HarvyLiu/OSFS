name: curriculum
on:
  push:
  pull_request:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python3 scripts/audit_lessons.py
      - run: python3 scripts/check_figures.py
      - run: python3 scripts/build_graph.py --check
  site:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm install
        working-directory: site-astro
      - run: npm run build
        working-directory: site-astro
      - uses: actions/upload-pages-artifact@v3
        with: { path: site-astro/dist }
  deploy:
    needs: site
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
  docker-toolchain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f docker/Dockerfile -t osfs .
      - run: docker run --rm -v ${{ github.workspace }}:/osfs -w /osfs osfs bash scripts/ci_linux.sh
